<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-md">

    <h1 class="text-2xl font-bold mb-6 text-gray-800 text-left">
        Melhores Trilhas
    </h1>

    <h1 class="text-2xl font-bold text-center text-gray-800 mb-1">
      Criação de conta
    </h1>

    <p class="text-center text-gray-500 mb-4">
      Preencha os dados para começar
    </p>

    <form (ngSubmit)="cadastrar()" class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Nome
        </label>

        <input
          type="text"
          name="nome"
          [(ngModel)]="nome"
          placeholder="Seu nome"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          E-mail
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="seu@email.com"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Senha
        </label>

        <input
          type="password"
          name="senha"
          [(ngModel)]="senha"
          placeholder="Sua senha"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition cursor-pointer">
        Criar conta
      </button>

    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Já possui uma conta?

      <a routerLink="/login" class="text-blue-600 font-semibold hover:underline">
        Entrar
      </a>
    </p>

  </div>
</div>

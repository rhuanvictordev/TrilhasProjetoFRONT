
<div class="p-6 mx-auto max-w-7xl">
    <h2 class="font-bold py-4 text-xl ">
        Usuários Cadastrados
    </h2>

    <div class="overflow-x-auto">
        <table class="w-full border-collapse border border-gray-300 shadow-sm text-sm">
            <thead class="bg-gray-200">
                <tr>
                    <th class="border border-gray-300 px-4 py-3 text-left">#</th>
                    <th class="border border-gray-300 px-4 py-3 text-left">Nome</th>
                    <th class="border border-gray-300 px-4 py-3 text-left">Email</th>
                    <th class="border border-gray-300 px-4 py-3 text-left">Acesso</th>
                    <th class="border border-gray-300 px-4 py-3 text-center">Opções</th>
                </tr>
            </thead>

            <tbody>
                @for (u of (usuarios() ?? []); track u.id) {
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="border border-gray-300 px-4 py-3"> {{ u.id }} </td>
                        <td class="border border-gray-300 px-4 py-3"> {{ u.nome }} </td>
                        <td class="border border-gray-300 px-4 py-3"> {{ u.email }} </td>
                        <td class="border border-gray-300 px-4 py-3"> 
                            @if (u.papel == "adm"){
                                <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm"> administrador </span> 
                            }@else{
                                <span class="bg-gray-500 text-white px-3 py-1 rounded-full text-sm"> usuário </span>
                            }
                        </td>
                        <td class="border border-gray-300 px-4 py-3 text-center whitespace-nowrap">
                            <button class="text-blue-600 hover:text-blue-800 mr-3 cursor-pointer"> Editar </button>
                            <button class="text-red-600 hover:text-red-800 cursor-pointer" (click)="excluir(u.id)"> Excluir </button>
                        </td>
                    </tr>
                } @empty {
                    <tr>
                        <td colspan="5" class="text-center py-6 text-gray-500">
                            Nenhum usuário cadastrado.
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>

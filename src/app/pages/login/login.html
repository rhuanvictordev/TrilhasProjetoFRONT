<div class="h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-md">

    <h1 class="text-2xl font-bold text-gray-800 mb-2">
      Melhores Trilhas
    </h1>

    <h2 class="text-2xl font-bold text-center text-gray-800 mt-8 mb-2">
      Bem-vindo de volta!
    </h2>

    <p class="text-center text-gray-500 mb-8">
      Entre com sua conta para continuar
    </p>

    <form (ngSubmit)="entrar()" class="space-y-5">

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
          E-mail
        </label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          placeholder="seu@email.com"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>

      <div>
        <label for="senha" class="block text-sm font-medium text-gray-700 mb-1">
          Senha
        </label>

        <input
          id="senha"
          name="senha"
          type="password"
          [(ngModel)]="senha"
          required
          placeholder="Sua senha"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition cursor-pointer">
        Entrar
      </button>

    </form>

    <div class="flex items-center gap-3 my-6">
      <div class="flex-1 border-t border-gray-200"></div>
      <span class="text-sm text-gray-400">ou</span>
      <div class="flex-1 border-t border-gray-200"></div>
    </div>

    <p class="text-center text-sm text-gray-600">
      Ainda não possui uma conta?

      <a
        routerLink="/cadastro"
        class="text-blue-600 font-semibold hover:underline">
        Criar conta
      </a>
    </p>

  </div>
</div>
